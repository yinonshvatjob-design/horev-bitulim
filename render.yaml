services:
  # 1. Full Cloud Node.js API & Web Application
  - type: web
    name: horev-bitulim-platform
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: GMAIL_USER
        value: bitulim@horev.org.il
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: TREASURER_EMAIL
        value: chagi@horev.org.il
      - key: SECRETARY_EMAIL
        value: esters@horev.org.il
      - key: DATABASE_URL
        fromDatabase:
          name: bitulim-db
          property: connectionString

# 2. Managed Cloud PostgreSQL Database
databases:
  - name: bitulim-db
    databaseName: school_bitulim
    user: admin
